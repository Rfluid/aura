[package]
name              = "aura-cli"
version           = "0.1.0"
edition.workspace = true
license.workspace = true

# Headless `aura <subcommand>` surface. No UI deps: every subcommand runs
# without spinning up GPUI.
[dependencies]
aura-core.workspace     = true
anyhow.workspace        = true
clap.workspace          = true
clap_complete.workspace = true
serde.workspace         = true
serde_json.workspace    = true
toml.workspace          = true

[target.'cfg(unix)'.dependencies]
# SIGPIPE reset in `dispatch`, SIGTERM handling in `aura update`.
libc = "0.2"
