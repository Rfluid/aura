[workspace]
members = [
    "crates/aura",
    "crates/aura-core",
    "plugins/rtk-gains",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"

[workspace.dependencies]
# Internal crates — versions kept in sync by scripts/prepare-release.sh
aura-core        = { path = "crates/aura-core",   version = "0.1.3" }
aura-plugin-rtk  = { path = "plugins/rtk-gains",  version = "0.1.0" }

# External
anyhow                = "1"
chrono                = { version = "0.4", default-features = false, features = ["std", "clock", "serde", "unstable-locales"] }
dirs                  = "5"
notify-debouncer-mini = "0.7"
serde                 = { version = "1", features = ["derive"] }
serde_json            = "1"
thiserror             = "2"
toml                  = "0.8"
ureq                  = { version = "3", features = ["json"] }
