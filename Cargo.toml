[workspace]
members = [
    "crates/aura",
    "crates/aura-core",
    "plugins/rtk-gains",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow                = "1"
chrono                = { version = "0.4", default-features = false, features = ["std", "clock"] }
dirs                  = "5"
notify-debouncer-mini = "0.7"
serde                 = { version = "1", features = ["derive"] }
serde_json            = "1"
thiserror             = "2"
toml                  = "0.8"
